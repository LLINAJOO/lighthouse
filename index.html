/* Layout: full-screen pixel canvas, HUD pinned to corners, dialog and panels as wooden-frame pixel cards. Single deliberate night-sea look. */
:root{
  --sea:#0e1a2c; --panel:#1c2638; --panel-2:#253250; --paper:#f2e6cc; --ink:#f4ecd8; --muted:#a9b4c8;
  --lamp:#ffc95c; --rust:#c8553d; --line:#e9dcbc; --shadow:#070c16;
  --f-display:"LH Digits","Pixelify Sans", "Courier New", monospace;
  --f-body:"LH Digits","Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--sea);color:var(--ink);overflow:hidden;font-family:var(--f-body);-webkit-user-select:none;user-select:none;touch-action:none}
#game{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.pix{background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px var(--shadow),6px 6px 0 3px rgba(0,0,0,.35);border-radius:2px}
#hud{position:fixed;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
#clock{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));padding:8px 12px 9px;min-width:150px}
#clock .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
#dayN{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--lamp)}
#wx{font-size:13px;color:var(--muted)}
#time{font-family:var(--f-display);font-size:36px;line-height:.95;font-weight:600;letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1.05}
#tod{font-size:13px;color:var(--muted);text-transform:lowercase}
#souv{font-size:13px;color:var(--paper);margin-top:3px}
#tasks{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(124px + env(safe-area-inset-top,0px));padding:8px 12px;max-width:260px;font-size:14px}
#tasks h3{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--lamp);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
#tasks ul{list-style:none;margin:0;padding:0;display:grid;gap:3px}
#tasks li{display:flex;gap:7px;line-height:1.2}
#tasks li .b{flex:none;width:10px;height:10px;margin-top:3px;border:2px solid var(--line)}
#tasks li.done{color:#7f8aa0;text-decoration:line-through}
#tasks li.done .b{background:var(--lamp);border-color:var(--lamp)}
#tasks li.q{color:#bfe3d6}
#tasks li.q .b{border-radius:50%;border-color:#8fd0b9}
#tasks.min ul{display:none}
#btns{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px}
.btn{font-family:var(--f-display);font-size:15px;color:var(--ink);background:var(--panel);border:3px solid var(--line);box-shadow:0 0 0 3px var(--shadow),3px 3px 0 3px rgba(0,0,0,.3);padding:6px 11px;cursor:pointer;border-radius:2px}
.btn:hover{background:var(--panel-2)}
.btn:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
.btn kbd{font-family:inherit;color:var(--lamp);font-size:12px;margin-left:5px}
.btn.primary{background:var(--lamp);color:#2a1b08;border-color:#fff1c9}
.btn.primary:hover{background:#ffd683}
#prompt{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:6px 14px;font-size:16px;white-space:nowrap}
#prompt b{color:var(--lamp);margin-right:8px}
#toasts{z-index:31!important;position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:grid;gap:6px;justify-items:center;pointer-events:none;z-index:5}
.toast{padding:5px 12px;font-size:15px;animation:tin .25s ease-out;display:flex;gap:8px;align-items:center}
.toast canvas{width:24px;height:24px;image-rendering:pixelated}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#dialog{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(720px,calc(100vw - 32px));padding:12px 14px;display:flex;gap:14px;cursor:pointer;z-index:4;box-sizing:border-box}
#portrait{flex:none;width:80px;height:88px;image-rendering:pixelated;background:var(--panel-2);border:2px solid var(--line)}
#dialog .who{font-family:var(--f-display);font-weight:700;color:var(--lamp);font-size:17px;margin-bottom:3px}
#dialog .txt{font-size:18px;line-height:1.35;min-height:3.9em;max-width:60ch}
#dialog .more{position:absolute;right:14px;bottom:8px;color:var(--lamp);animation:bob 1s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}
#dialog.letter{background:var(--paper);color:#3b2f22;border-color:#8b6b47}
#dialog.letter .txt{font-size:18px;font-style:italic}
#dialog.letter .who{color:#8b4a2b}
#ask{position:fixed;inset:0;display:grid;place-items:center;background:rgba(7,12,22,.45);z-index:6}
#ask .card{width:min(420px,calc(100vw - 32px));padding:16px 18px;box-sizing:border-box;display:grid;gap:14px}
#askT{font-size:18px;line-height:1.4}
#ask .row{display:flex;gap:10px;flex-wrap:wrap}
#ask .row.col{flex-direction:column;align-items:stretch}
#ask .btn,#nameBox .btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
#ask .btn small{font-size:12px;opacity:.8;font-family:var(--f-body)}
#ask .btn:disabled{opacity:.42;cursor:default}
#ask .card{max-height:calc(100vh - 60px);overflow:auto}
#nameBox{position:fixed;inset:0;display:grid;place-items:center;background:rgba(7,12,22,.45);z-index:7}
#nameBox .card{width:min(360px,calc(100vw - 32px));padding:16px 18px;box-sizing:border-box;display:grid;gap:12px}
#nameT{font-size:18px}
#catName{font-family:var(--f-display);font-size:22px;padding:6px 10px;background:var(--panel-2);color:var(--ink);border:3px solid var(--line);border-radius:2px;width:100%;box-sizing:border-box}
#catName:focus{outline:3px solid var(--lamp);outline-offset:2px}
#scope{position:fixed;inset:0;display:grid;place-items:center;background:rgba(3,6,12,.82);z-index:6}
#scope .scard{width:min(720px,calc(100vw - 32px));padding:12px;box-sizing:border-box;display:grid;gap:10px;max-height:calc(100vh - 40px);overflow:auto}
#scopeC{width:100%;aspect-ratio:240/150;image-rendering:pixelated;background:#000;display:block;max-width:100%}
#scope .cap{display:grid;gap:4px}
#scope .cap b{font-family:var(--f-display);color:var(--lamp);font-size:20px}
#scope .cap p{margin:0;font-size:16px;line-height:1.45;max-width:62ch}
#scope .cap .btn{justify-self:start;margin-top:4px}
.toast.ach{border-color:var(--lamp);background:#2b2a22}
.toast.ach i{font-style:normal;color:var(--lamp);font-size:20px}
.toast.ach small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--lamp)}
#achGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.achc{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;background:var(--panel-2);border:2px solid #4a5a7c;opacity:.6;min-width:0}
.achc.on{opacity:1;border-color:var(--lamp)}
.achc i{font-style:normal;font-size:20px;color:var(--lamp);line-height:1}
.achc b{display:block;font-size:15px}
.achc span{font-size:13px;color:var(--muted)}
.entry.rec{font-size:14px;color:var(--muted)}
.entry.rec.ok{color:#bfe3d6}
.entry.rec.ok b::after{content:" · можно сделать";color:#8fd0b9}
#panel .card{width:min(700px,calc(100vw - 32px))}
#dev{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));z-index:30;width:min(300px,calc(100vw - 32px));max-height:calc(100vh - 150px);overflow:auto;background:rgba(14,20,32,.92);border:2px dashed #e86a5a;padding:8px 10px;font-size:12px;box-sizing:border-box}
#dev.min{width:auto}
#dev .dhead{display:flex;gap:6px;align-items:center}
#dev .dhead b{color:#e86a5a;letter-spacing:.08em;text-transform:uppercase;margin-right:auto}
#dev button{font:inherit;font-size:12px;color:var(--ink);background:#253250;border:1px solid #4a5a7c;padding:3px 7px;cursor:pointer;border-radius:2px}
#dev button:hover{background:#33456b}
#dev button.on{background:var(--lamp);color:#2a1b08;border-color:var(--lamp)}
#dev .drow{margin-top:8px}
#dev .drow>span{display:block;color:var(--muted);margin-bottom:3px}
#dev .drow>div{display:flex;flex-wrap:wrap;gap:4px}
#doc{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,8,15,.72);z-index:6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#doc .dcard{width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;display:grid;gap:12px;justify-items:center}
#doc .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.paper{--pp:#f3e9d2;width:100%;box-sizing:border-box;background:var(--pp);color:#3b2f22;padding:22px 26px;box-shadow:0 10px 30px rgba(0,0,0,.45);border-radius:2px;transform:rotate(-.6deg)}
.paper.lined{background-image:repeating-linear-gradient(transparent 0 33px,#c9d6e8 33px 34px);background-color:#f6f0e2}
.paper.aged{background:radial-gradient(circle at 18% 22%,rgba(150,110,50,.18),transparent 30%),radial-gradient(circle at 82% 78%,rgba(120,80,30,.22),transparent 34%),linear-gradient(#ead7a8,#dcc28a);transform:rotate(.8deg)}
.hw{font-family:"Caveat","Segoe Script","Comic Sans MS",cursive;font-size:clamp(22px,4.6vw,27px);line-height:1.25;margin:0 0 8px;max-width:none}
.hw.sig{text-align:right;margin-top:6px}

<body>

<script>
"use strict";
// ===================== CORE: utils, tiles, maps =====================
const T = 16;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
function R(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); }
function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; }
function ell(c, x, y, rx, ry, col) { c.fillStyle = col; c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); c.fill(); }
function disc(c, cx, cy, r, col) { c.fillStyle = col; for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy + r * .8)); c.fillRect(Math.round(cx - w), Math.round(cy + dy), w * 2 + 1, 1); } }

// tile ids
const DEEP = 0, SHALLOW = 1, SAND = 2, GRASS = 3, FOREST = 4, PATH = 5, ROCK = 6, WOOD = 7, WALL = 8, STONE = 9, RUG = 10, VOID = 11, RAIL = 12, GLASS = 13, GRATE = 14, PIER = 15;
const SOLID = new Set([DEEP, SHALLOW, ROCK, WALL, VOID, RAIL, GLASS]);
const isWater = t => t === DEEP || t === SHALLOW;

function newMap(id, w, h, opt = {}) {
  return Object.assign({ id, w, h, t: new Uint8Array(w * h), objs: [], decor: [], ground: null }, opt);
}
const tAt = (m, x, y) => (x < 0 || y < 0 || x >= m.w || y >= m.h) ? (m.edge ?? DEEP) : m.t[y * m.w + x];
const tSet = (m, x, y, v) => { if (x >= 0 && y >= 0 && x < m.w && y < m.h) m.t[y * m.w + x] = v; };

// ---------- island ----------
function genIsland() {
  const w = 104, h = 52, m = newMap('island', w, h, { edge: DEEP, outdoor: true });
  const cx = 32, cy = 24;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const nx = (x - cx) / 25.5, ny = (y - cy) / (y > cy ? 17 : 18);
    const n = Math.sin(x * .33 + 1.3) * .045 + Math.cos(y * .41 + x * .12) * .05 + (hash(x >> 2, y >> 2) - .5) * .07;
    const d1 = Math.sqrt(nx * nx + ny * ny) + n;
    // the far forest: a second, wooded half of the island to the east
    const ex = (x - 80) / 21, ey = (y - 28) / (y > 28 ? 16 : 17);
    const n2 = Math.sin(x * .29 + 2) * .05 + Math.cos(y * .37 + x * .08) * .05 + (hash((x >> 2) + 30, (y >> 2) + 40) - .5) * .08;
    const d2 = Math.sqrt(ex * ex + ey * ey) + n2;
    const br = x >= 46 && x <= 66 && y >= 29 && y <= 37 ? .5 + Math.abs(y - 33) * .12 : 9; // isthmus
    const d = Math.min(d1, d2, br), main = d === d1;
    let t = d < (y > 31 && main ? .66 : .78) ? GRASS : d < .94 ? SAND : d < 1.07 ? SHALLOW : DEEP;
    if (main && y < 17 && d1 > .72 && d1 < .97) t = ROCK;
    if (main && x > 50 && y > 20 && y < 30 && d1 > .8 && d1 < .96) t = ROCK; // gull rocks east
    if (main && x < 13 && y > 30 && y < 37 && d1 > .82 && d1 < .97) t = ROCK; // west fishing rocks
    if (t === GRASS && main && x > 4 && x < 21 && y > 14 && y < 34) t = FOREST;
    if (t === GRASS && d === d2 && d2 < .8) t = FOREST;
    if (d2 > .74 && d2 < .95 && d === d2 && x > 92 && y < 30) t = ROCK; // eastern crags
    const gl = Math.hypot(x - 76, y - 29), pd = Math.hypot(x - 84, y - 22);
    if (gl < 4.3 && t === FOREST) t = GRASS; // glade
    if (pd < 3.8 && (t === FOREST || t === GRASS)) t = pd < 2.6 ? SHALLOW : GRASS; // forest pond
    m.t[y * w + x] = t;
  }
  const stamp = (x0, y0, x1, y1, v, only) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { if (!only || only.includes(tAt(m, x, y))) tSet(m, x, y, v); } };
  // lighthouse yard and cliffs clearing
  stamp(28, 9, 39, 15, GRASS);
  stamp(29, 8, 38, 8, ROCK);
  // viewpoint (смотровая) NE
  stamp(44, 11, 49, 14, GRASS, [ROCK, SAND, SHALLOW, DEEP, GRASS]);
  stamp(45, 11, 48, 13, STONE);
  stamp(44, 10, 49, 10, ROCK);
  // cliff NW (утёс)
  stamp(18, 11, 23, 14, GRASS, [ROCK, SAND, GRASS, SHALLOW]);
  stamp(17, 10, 24, 10, ROCK);
  // west fishing stone
  stamp(9, 32, 10, 33, STONE);
  stamp(10, 29, 13, 33, SAND, [ROCK, SHALLOW, DEEP]); stamp(9, 32, 10, 33, STONE);
  // paths
  const path = (pts) => {
    for (let i = 0; i < pts.length - 1; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1]; const n = Math.max(Math.abs(bx - ax), Math.abs(by - ay)) * 3;
      for (let k = 0; k <= n; k++) {
        const x = Math.round(lerp(ax, bx, k / n)), y = Math.round(lerp(ay, by, k / n));
        for (const [dx, dy] of [[0, 0], [1, 0]]) { const tt = tAt(m, x + dx, y + dy); if (tt === GRASS || tt === FOREST) tSet(m, x + dx, y + dy, PATH); }
      }
    }
  };
  path([[33, 13], [33, 18], [31, 24], [31, 31], [30, 36]]);
  path([[31, 22], [38, 23], [45, 27]]);
  path([[33, 17], [40, 16], [45, 14]]);
  path([[31, 27], [24, 27], [16, 25]]);
  path([[24, 27], [21, 20], [20, 15]]);
  path([[45, 27], [50, 31], [56, 33], [63, 33], [69, 31], [76, 29]]);
  path([[76, 29], [79, 26], [81.5, 24.6]]);
  path([[76, 29], [80, 33], [86, 36], [88, 37]]);
  path([[69, 31], [67, 25], [70, 19]]);
  path([[16, 25], [12, 31], [10, 32]]);
  // pier x 30..31 from first non-land to y=46
  for (let y = 30; y <= 46; y++) for (let x = 30; x <= 31; x++) { if (isWater(tAt(m, x, y)) || (y > 37)) tSet(m, x, y, PIER); }
  // make sure path connects to pier
  for (let y = 30; y <= 46; y++) { if (tAt(m, 30, y) === SAND || tAt(m, 30, y) === GRASS) { tSet(m, 30, y, PATH); tSet(m, 31, y, PATH); } }
  return m;
}

// ---------- shed interior ----------
function genShed() {
  const w = 12, h = 10, m = newMap('shed', w, h, { edge: WALL, indoor: true });
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) m.t[y * w + x] = (y <= 1 || x === 0 || x === w - 1 || y === h - 1) ? WALL : WOOD;
  tSet(m, 6, h - 1, WOOD); tSet(m, 5, h - 1, WOOD);
  return m;
}

// ---------- house (ground floor) ----------
function genHouse() {
  const w = 18, h = 12, m = newMap('house', w, h, { edge: WALL, indoor: true });
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let t = WOOD;
    if (y <= 1 || x === 0 || x === w - 1 || y === h - 1) t = WALL;
    if (x >= 12 && x <= 15 && y >= 5 && y <= 8) t = RUG;
    if (x >= 7 && x <= 10 && y >= 2 && y <= 4) t = STONE;
    m.t[y * w + x] = t;
  }
  tSet(m, 9, h - 1, WOOD); tSet(m, 8, h - 1, WOOD); // door gap
  m.door = { x: 9 * T, y: (h - 1) * T };
  return m;
}

// ---------- lantern room ----------
function genLamp() {
  const w = 15, h = 14, m = newMap('lamp', w, h, { edge: VOID, indoor: true, high: true });
  const cx = 7.5, cy = 6.5;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const dx = x + .5 - cx, dy = y + .5 - cy, r = Math.sqrt(dx * dx + dy * dy);
    const a = Math.atan2(dy, dx);
    const gap = Math.abs(Math.sin(a * 2)) < .32;
    let t = VOID;
    if (r < 3.7) t = STONE;
    else if (r < 4.6) t = gap && Math.abs(Math.cos(a)) > .5 ? STONE : GLASS;
    else if (r < 5.9) t = GRATE;
    else if (r < 6.6) t = RAIL;
    m.t[y * w + x] = t;
  }
  return m;
}

function speck(c, px, py, sx, sy, n, cols, sz = 1) {
  for (let i = 0; i < n; i++) {
    const a = hash(sx * 31 + i * 7, sy * 17 + i * 13), b = hash(sx * 11 + i * 5, sy * 29 + i * 3);
    R(c, px + Math.floor(a * (16 - sz)), py + Math.floor(b * (16 - sz)), sz, sz, cols[i % cols.length]);
  }
}

function buildGround(m) {
  const [cv, c] = mk(m.w * T, m.h * T);
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
    const t = tAt(m, x, y), px = x * T, py = y * T;
    switch (t) {
      case GRASS: R(c, px, py, T, T, COL.grass); speck(c, px, py, x, y, 7, [COL.grass2, COL.grass3, COL.grass2]); if (hash(x, y) > .7) { R(c, px + 4, py + 9, 3, 1, COL.grass3); R(c, px + 10, py + 3, 2, 1, COL.grass2); } break;
      case FOREST: R(c, px, py, T, T, COL.forest); speck(c, px, py, x, y, 9, [COL.forest2, COL.forest3, COL.forest2]); break;
      case SAND: R(c, px, py, T, T, COL.sand); speck(c, px, py, x, y, 6, [COL.sand2, COL.sand3]); break;
      case PATH: R(c, px, py, T, T, COL.path); speck(c, px, py, x, y, 7, [COL.path2, COL.path3], 1); if (hash(x + 3, y) > .75) R(c, px + 5, py + 6, 2, 2, COL.path2); break;
      case ROCK: {
        R(c, px, py, T, T, COL.rock); speck(c, px, py, x, y, 6, [COL.rock2, COL.rock3], 2);
        const below = tAt(m, x, y + 1);
        if (below !== ROCK) { R(c, px, py + 10, T, 6, COL.cliff); for (let i = 0; i < 4; i++) R(c, px + 2 + i * 4, py + 11 + (hash(x + i, y) * 3 | 0), 1, 4, '#3f424b'); R(c, px, py + 9, T, 1, COL.rock3); }
        break;
      }
      case PIER: case WOOD: {
        const base = t === PIER ? '#9a6a42' : COL.wood;
        R(c, px, py, T, T, base);
        for (let i = 0; i < 4; i++) { R(c, px, py + i * 4 + 3, T, 1, COL.wood2); if (hash(x * 3 + i, y) > .5) R(c, px + (hash(x, y + i) * 14 | 0), py + i * 4, 1, 3, COL.wood2); R(c, px + 1 + (hash(i, x + y) * 12 | 0), py + i * 4 + 1, 2, 1, COL.wood3); }
        if (t === PIER) { if (isWater(tAt(m, x - 1, y))) R(c, px, py, 1, T, '#5d3e24'); if (isWater(tAt(m, x + 1, y))) R(c, px + 15, py, 1, T, '#5d3e24'); }
        break;
      }
      case WALL: {
        R(c, px, py, T, T, '#3a2e2a');
        if ((m.id === 'house' || m.id === 'shed') && y <= 1) { R(c, px, py, T, T, y === 0 ? '#5b4a3f' : m.id === 'shed' ? '#8a6a48' : COL.wall); if (y === 1) { R(c, px, py + 13, T, 3, COL.wall2); for (let i = 0; i < 2; i++) R(c, px + i * 8, py + 4 + (x % 2) * 4, 1, 4, COL.wall2); } }
        else if (m.id === 'house' || m.id === 'shed') { R(c, px, py, T, T, '#4d3e34'); R(c, px + 2, py + 2, 12, 12, '#5b4a3f'); }
        break;
      }
      case STONE: R(c, px, py, T, T, COL.stone); R(c, px, py + 7, T, 1, COL.stone2); R(c, px + ((y % 2) ? 4 : 11), py, 1, 7, COL.stone2); R(c, px + ((y % 2) ? 11 : 4), py + 8, 1, 8, COL.stone2); speck(c, px, py, x, y, 3, ['#aaa49a']); break;
      case RUG: R(c, px, py, T, T, COL.rug); R(c, px + 2, py + 2, 12, 12, COL.rug2); R(c, px + 4, py + 4, 8, 8, COL.rug); speck(c, px, py, x, y, 4, ['#e5c07b']); break;
      case GRATE: R(c, px, py, T, T, '#3d4250'); for (let i = 0; i < 16; i += 4) { R(c, px + i, py, 1, T, '#2b2f3a'); R(c, px, py + i, T, 1, '#2b2f3a'); } break;
      case RAIL: R(c, px, py, T, T, '#2a2e38'); R(c, px + 6, py + 6, 4, 4, '#555b6a'); break;
      case GLASS: R(c, px, py, T, T, 'rgba(160,210,230,.35)'); R(c, px, py, T, 2, '#4a3b30'); R(c, px + 7, py, 2, T, '#4a3b30'); R(c, px + 3, py + 4, 1, 6, 'rgba(255,255,255,.6)'); break;
    }
  }
  // soft edges: grass tongues over sand/path, wet sand along water
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
    const t = tAt(m, x, y), px = x * T, py = y * T;
    if (t === SAND || t === PATH) {
      const g = n => n === GRASS || n === FOREST;
      const col = n => n === FOREST ? COL.forest : COL.grass;
      const u = tAt(m, x, y - 1), d = tAt(m, x, y + 1), l = tAt(m, x - 1, y), r = tAt(m, x + 1, y);
      for (let i = 0; i < 16; i += 2) {

        if (g(d)) { const hh = 1 + (hash(x * 16 + i, y + 99) * 3 | 0); R(c, px + i, py + 16 - hh, 2, hh, col(d)); }
        if (g(l)) R(c, px, py + i, 1 + (hash(x, y * 16 + i) * 4 | 0), 2, col(l));
        if (g(r)) { const ww = 1 + (hash(x + 99, y * 16 + i) * 3 | 0); R(c, px + 16 - ww, py + i, ww, 2, col(r)); }
      }
      if (t === SAND) { if (isWater(d)) R(c, px, py + 13, T, 3, COL.wet); if (isWater(u)) R(c, px, py, T, 2, COL.wet); if (isWater(l)) R(c, px, py, 2, T, COL.wet); if (isWater(r)) R(c, px + 14, py, 2, T, COL.wet); }

  // water tile cache
  m.water = [];
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
    const t = tAt(m, x, y); if (!isWater(t)) continue;
    const e = []; const land = n => !isWater(n) && n !== PIER;
    if (land(tAt(m, x, y - 1))) e.push(0); if (land(tAt(m, x, y + 1))) e.push(1); if (land(tAt(m, x - 1, y))) e.push(2); if (land(tAt(m, x + 1, y))) e.push(3);
    m.water[y * m.w + x] = e;
  }
}

// ---------- animated water (also used outside the map) ----------
function drawWater(c, m, cam, vw, vh, time, dark, sunset) {
  const x0 = Math.floor(cam.x / T) - 1, y0 = Math.floor(cam.y / T) - 1, x1 = x0 + Math.ceil(vw / T) + 2, y1 = y0 + Math.ceil(vh / T) + 2;
  const moonX = m.w * T * .62;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const inside = x >= 0 && y >= 0 && x < m.w && y < m.h;
    const t = inside ? m.t[y * m.w + x] : DEEP;
    if (!isWater(t) && t !== PIER) continue;
    const px = x * T - cam.x, py = y * T - cam.y, h = hash(x, y), h2 = hash(y + 7, x + 3);
    const sh = t === SHALLOW;
    R(c, px, py, T, T, sh ? COL.shal : COL.deep);
    if (!sh && h > .55) R(c, px + (h2 * 8 | 0), py + (h * 10 | 0), 6, 5, COL.deep2);
    const ph = time * 1.3 + h * 6.28;
    const s = Math.sin(ph);
    if (s > .45) { const o = Math.round(Math.sin(time * .9 + x) * 2); R(c, px + 3 + (h2 * 6 | 0) + o, py + 3 + (h * 9 | 0), 4 + (s > .8 ? 2 : 0), 1, sh ? '#6cc3d4' : '#4a8fb0'); }
    if (s < -.6 && h2 > .5) R(c, px + (h * 10 | 0), py + (h2 * 12 | 0), 3, 1, sh ? '#56b3c8' : '#2f6d92');
    if (sunset > 0 && !sh && Math.sin(time * 2 + h * 30) > .2) { c.globalAlpha = sunset * .6; R(c, px + (h * 12 | 0), py + (h2 * 14 | 0), 3, 1, '#ffb36b'); c.globalAlpha = 1; }
    if (dark > .35) {
      if (h > .9) { c.globalAlpha = dark * (.5 + .5 * Math.sin(time * 3 + h * 90)); R(c, px + (h2 * 14 | 0), py + (h * 14 | 0), 1, 1, '#fff6d8'); c.globalAlpha = 1; }
      if (Math.abs(x * T + 8 - moonX) < 44 && y * T > m.h * T * .55 && Math.sin(time * 2.2 + h * 40) > .3) { c.globalAlpha = dark * .8; R(c, px + (h * 10 | 0), py + (h2 * 13 | 0), 4 + (h2 * 4 | 0), 1, '#cfe1ff'); c.globalAlpha = 1; }
    }
    if (inside && m.water && sh) {
      const e = m.water[y * m.w + x] || [];
      if (e.length) {
        R(c, px, py, T, T, 'rgba(120,205,215,.25)');
        const o = Math.round((Math.sin(time * 1.6 + x * .7 + y * .5) + 1) * 1.6);
        c.globalAlpha = .55 + .35 * Math.sin(time * 1.6 + x * .7 + y * .5);
        for (const d of e) {
          for (let i = 0; i < 16; i += 3) {
            const j = (hash(x * 16 + i, y + d) * 2) | 0;
            if (d === 0) R(c, px + i, py + o + j, 2, 1, COL.foam);
            if (d === 1) R(c, px + i, py + 15 - o - j, 2, 1, COL.foam);
            if (d === 2) R(c, px + o + j, py + i, 1, 2, COL.foam);
            if (d === 3) R(c, px + 15 - o - j, py + i, 1, 2, COL.foam);
          }
        }
        c.globalAlpha = 1;
      }
    }
  }
}

function drawPerson(c, x, y, L, o = {}) {

    R(c, x + 1, yb - 5 + (step < 0 ? -1 : 0), 2, 5, L.pants);
    R(c, x - 3, y - 1 + (step > 0 ? -1 : 0), 2, 1, '#2a2420'); R(c, x + 1, y - 1 + (step < 0 ? -1 : 0), 2, 1, '#2a2420');
  } else {

    R(c, x - 1 + step * s + (s > 0 ? 1 : -1), y - 1, 2, 1, '#2a2420');
  }

  const ty = yb - 12 - H * 0;
  const tw = sm ? 8 : 8, th = sm ? 6 : 7;
  const tyy = yb - 5 - th + (o.sit ? 2 : 0);
  R(c, x - tw / 2, tyy, tw, th + (L.long ? 2 : 0), L.coat);
  R(c, x - tw / 2, tyy + th - 1 + (L.long ? 2 : 0), tw, 1, L.coat2);

  if (L.scarf) R(c, x - 4, tyy, 8, 2, L.scarf);
  if (L.bag && dir !== 3) R(c, dir === 1 ? x + 2 : x - 5, tyy + 3, 3, 4, L.bag);
  // arms
  const sw = mv ? step : 0;
  const act = o.act;
  if (dir === 0 || dir === 3) {
    R(c, x - tw / 2 - 1, tyy + 1 + (act ? -1 : sw), 1, 5, L.coat2); R(c, x + tw / 2, tyy + 1 + (act ? -1 : -sw), 1, 5, L.coat2);
    R(c, x - tw / 2 - 1, tyy + 6 + (act ? -1 : sw), 1, 1, L.skin); R(c, x + tw / 2, tyy + 6 + (act ? -1 : -sw), 1, 1, L.skin);
  } else {

  else { const s = dir === 1 ? 1 : -1; R(c, x - hw / 2, hy, hw, 2, L.hair); R(c, s > 0 ? x + 1 : x - hw / 2, hy, 3, 5, L.hair); }
  if (L.long && dir === 3) R(c, x - hw / 2, hy + 3, hw, 5, L.hair);
  if (L.long && (dir === 1 || dir === 2)) { const back = dir === 1 ? x + 1 : x - hw / 2; R(c, back, hy + 2, 3, 7, L.hair); R(c, dir === 1 ? x + 3 : x - hw / 2, hy + 8, 1, 1, L.hair); }

// ---------- props ----------
function shadowE(c, x, y, rx, ry, sh) { c.fillStyle = `rgba(18,26,40,${.28 * sh.a})`; c.beginPath(); c.ellipse(x + sh.dx * rx * .6, y + sh.dy * 2, rx * (1 + Math.abs(sh.dx) * .5), ry, 0, 0, 7); c.fill(); }

function drawPine(c, x, y, s, time, wind, sh, seed) {
  const sway = Math.sin(time * 1.2 + seed * 6) * wind;
  shadowE(c, x, y, 9 * s, 3.5 * s, sh);
  R(c, x - 2, y - 7 * s, 4, 7 * s, '#6b4a2e'); R(c, x - 2, y - 7 * s, 1, 7 * s, '#7d5838');
  const layers = [[11, 9, 0, '#2c6346'], [9, 8, 7, '#357253'], [7, 7, 13, '#40835e'], [4, 6, 18, '#4b9468']];
  layers.forEach(([w, hh, off, col], i) => {
    const sx = sway * (i + 1) * .35;

// ---------- per-day spawns ----------
function spawnDaily() {
  const isl = MAPS.island, house = MAPS.house;
  isl.objs = isl.objs.filter(o => !o.daily); house.objs = house.objs.filter(o => !o.daily);
  const rnd = rng(S.day * 101);
  // shells (keep total around 7 on the beach)
  const spots = WORLD.shellSpots.slice().sort(() => rnd() - .5).slice(0, 7);
  spots.forEach(([x, y], i) => addObj('island', { daily: 1, x, y, kind: 'shell', r: 12, gone: false, on() { return !this.gone; }, draw(c, sx, sy) { const s = Math.sin(G.time * 2 + i) > .85; R(c, sx - 2, sy - 2, 5, 3, '#f3d2c0'); R(c, sx - 1, sy - 3, 3, 1, '#f7e2d6'); R(c, sx - 2, sy, 5, 1, '#d9a990'); if (s) R(c, sx + 2, sy - 4, 1, 1, '#fff'); }, use: { label: () => 'Поднять ракушку', run() { const o = this; startAct('pick', .4, () => { o.gone = true; give('shell'); UI.tasks(); }); } } }));
  // fix "this" binding for shell use
  isl.objs.filter(o => o.kind === 'shell').forEach(o => { const run = o.use.run; o.use = { label: o.use.label, run: () => run.call(o) }; });
  // berry bushes
  WORLD.branchSpots.slice(6, 10).forEach(([x, y]) => { const o = addObj('island', { daily: 1, x: x + 2, y: y + 2, kind: 'berry', solid: [-5, -3, 10, 3], picked: false, draw(c, sx, sy) { drawBush(c, sx, sy, G.sh, !o.picked); } }); o.use = { label: () => o.picked ? null : 'Собрать бруснику', run: () => startAct('pick', .6, () => { o.picked = true; give('berries', 2); }) }; });
  // branches for wood
  if (task('wood')) WORLD.branchSpots.slice(0, 6).forEach(([x, y], i) => { const o = addObj('island', { daily: 1, x, y, kind: 'branch', r: 13, gone: false, on: () => !o.gone, draw(c, sx, sy) { R(c, sx - 6, sy - 2, 12, 2, '#7a4d2c'); R(c, sx - 2, sy - 4, 1, 2, '#7a4d2c'); R(c, sx + 2, sy - 3, 4, 1, '#8a5a32'); R(c, sx - 6, sy - 2, 12, 1, '#9a6a42'); } }); o.use = { label: () => 'Подобрать хворост', run: () => startAct('pick', .5, () => { o.gone = true; give('wood'); }) }; });
  // dust
  if (task('clean')) [[3.5, 9.3], [7, 8.6], [13.8, 9.6]].forEach(([x, y], i) => { const o = addObj('house', { daily: 1, x: x * T, y: y * T, kind: 'dust', r: 14, gone: false, on: () => !o.gone, layer: -1, draw(c, sx, sy) { c.fillStyle = 'rgba(120,100,80,.55)'; c.beginPath(); c.ellipse(sx, sy - 2, 7, 3, 0, 0, 7); c.fill(); R(c, sx - 3, sy - 3, 1, 1, '#d9cfbd'); R(c, sx + 2, sy - 2, 1, 1, '#d9cfbd'); } }); o.use = { label: () => 'Подмести', run: () => startAct('sweep', 1.2, () => { o.gone = true; progress('clean'); }) }; });
  // pier debris (day 4)
  if (task('pier')) [[30.5, 38.5, 'w'], [31.4, 40.6, 'p'], [30.6, 42.8, 'w'], [31.3, 45, 'p']].forEach(([x, y, k]) => { const o = addObj('island', { daily: 1, x: x * T, y: y * T, kind: 'debris', r: 13, gone: false, on: () => !o.gone, draw(c, sx, sy) { if (k === 'w') { R(c, sx - 6, sy - 3, 12, 3, '#3d6b3a'); R(c, sx - 4, sy - 4, 3, 1, '#4f8a43'); R(c, sx + 2, sy - 2, 4, 1, '#2f5a2c'); } else { R(c, sx - 7, sy - 3, 14, 3, '#b08a5a'); R(c, sx - 7, sy - 3, 14, 1, '#c9a26e'); R(c, sx + 3, sy - 2, 1, 1, '#555'); } } }); o.use = { label: () => k === 'w' ? 'Убрать водоросли' : 'Убрать обломок доски', run: () => startAct('pick', .7, () => { o.gone = true; progress('pier'); }) }; });
  // supply crates (day 6) appear after meeting the ship
  spawnExtras();
  if (task('unload')) [[30.4, 38.2], [31.5, 38.6], [30.6, 39.6]].forEach(([x, y]) => { const o = addObj('island', { daily: 1, x: x * T, y: y * T, kind: 'supply', r: 13, gone: false, on: () => !o.gone && task('ship').done, draw(c, sx, sy) { drawCrate(c, sx, sy, G.sh, false); } }); o.use = { label: () => P.carry ? null : 'Взять ящик', run: () => { o.gone = true; P.carry = 'crate'; toast('Ящик в руках. Отнесите в кладовую маяка'); } }; });
}

function talk(id) {

    if (d === 7) {

      return say([L(S.min >= 1080 ? 'Иди, иди. Катер ждать не будет. А огонь твой я отсюда вижу — хорошо горит.' : 'Вечером провожу тебя. Все придём, не сомневайся.')]);
    }
  }
  if (id === 'lida') {
    if (d === 4) {
      if (!f.metLida) { f.metLida = 1; return say([L('Почта! Ой, вы смотритель? Последняя неделя, говорят? Тогда тем более держите: письмо из дома.')], () => { give('letter'); openDoc('letter', () => say([L('Новости? На материке ярмарка, на соседнем острове коза съела рыбацкую сеть. Всё как обычно.'), L('Я ещё загляну до вашего отъезда. Без почты тут грустно.')])); }); }
      return say([L('Письма — это ведь как маяк, только бумажный. Чтоб знали: о тебе помнят.')]);
    }
    if (d === 7) {
      if (!f.byeLida) { f.byeLida = 1; return say([L('Последний день! Я всё-таки успела.'), L('Без вас тут будет непривычно. Но маяк же никуда не денется. Значит, и вы вернётесь — хоть в гости.'), L('Передавайте Варе привет. Пусть свистит громче чаек!')], () => progress('bye')); }
      return say([L('Я подожду до катера. Хочу посмотреть, как вы уплываете, — это красиво.')]);

    if (S.q.shells === 1 && has('shell', 5)) { take('shell', 5); S.q.shells = 2; if (d >= 6) return say([L('Ура, ракушки! Теперь не улетит.'), L('А картина как раз высохла. Держи — это твой маяк. Ночью, с огнём.')], () => { S.q.shells = 3; give('painting'); UI.tasks(); }); return say([L('Ура! Теперь ничего не улетит.'), L('Я нарисую тебе картину. Только краска сохнет долго — приходи через пару дней.')], () => UI.tasks()); }

    if (d === 7 && !f.byeSonya) { f.byeSonya = 1; return say([L('Ты правда уезжаешь?'), L('Тогда я нарисую, как маяк светит без тебя. Но всё равно светит. Это будет грустная картина, но красивая.')], () => progress('bye')); }
    const lines = { 4: 'После шторма море зелёное, как бутылочное стекло. Я сто лет искала такой цвет.', 5: 'Сегодня туман. Я рисую то, чего не видно. Это сложнее всего.', 6: 'Дедушка говорит, ночью тут поют киты. Я бы нарисовала, но мне спать велят.', 7: 'Вечером приду на пирс. Не уезжай, не попрощавшись!' };
    if (S.q.shells === 1) return say([L('Ракушек пока ' + (S.inv.shell || 0) + ' из пяти. Они на пляже, поблёскивают у самой воды.')]);
    return say([L(lines[d] || 'Привет!')]);
  }
  if (id === 'gromov') {
    if (!f.metGromov) return inspectorVisit();
    return say([L('Туман к ночи не рассеется. Зажигайте огонь пораньше, смотритель.')]);
  }
  if (id === 'belov') {
    if (!f.metBelov) { f.metBelov = 1; return say([L('Капитан Белов, «Северянка». Привёз вам припасы.'), L('Знаете, в шторм третьего дня мы шли мимо. Ваш огонь вывел нас из-за мели. Спасибо, смотритель.'), L('Держите, старый компас. Пусть указывает домой. А ящики сгрузим на пирс.')], () => { give('compass'); progress('ship'); }); }
    return say([L('Ящики на пирсе — в кладовую их, будьте добры. Мы отходим к четырём.')]);
  }
}

// ---------- fishing ----------
const FISH_RULES = {
  cod: { spots: ['pier', 'rocks', 'crags'], w: 5, ok: () => true },
  flounder: { spots: ['pier'], w: 3, ok: h => h >= 8 && h < 18 },
  herring: { spots: ['pier', 'rocks'], w: 4, ok: h => h < 11 },
  perch: { spots: ['rocks', 'crags'], w: 3, ok: () => true },
  wolffish: { spots: ['crags'], w: 2.5, ok: h => h >= 18 || h < 6 },
  monk: { spots: ['crags', 'rocks'], w: 1.6, ok: (h, wx) => ['rain', 'storm', 'fog'].includes(wx) },
  trout: { spots: ['pond'], w: 3, ok: h => h < 10 || h >= 17 },
  crucian: { spots: ['pond'], w: 4, ok: () => true },
  eel: { spots: ['pond'], w: 2.5, ok: h => h >= 20 || h < 5 },
};
const SPOT_NAME = { pier: 'пирс', rocks: 'камни на западе', crags: 'скалы Дальнего леса', pond: 'лесное озеро' };
function catchFish(spot) {
  const h = (S.min % 1440) / 60;
  let pool = Object.entries(FISH_RULES).filter(([, r]) => r.spots.includes(spot || 'pier') && r.ok(h, S.weather));
  if (!pool.length) pool = [['cod', FISH_RULES.cod]];
  // undiscovered species bite a little more often, so the atlas fills up
  const wt = ([id, r]) => r.w * (atlasHas('fish', id) ? 1 : 1.6);
  let roll = Math.random() * pool.reduce((s, x) => s + wt(x), 0), pick = pool[0][0];
  for (const x of pool) { roll -= wt(x); if (roll <= 0) { pick = x[0]; break; } }
  give('fish', 1, true);
  const it = ATLAS.fish.items.find(x => x.id === pick);
  const fresh = atlasAdd('fish', pick);
  if (!fresh) toast('Поймана: ' + it.n.toLowerCase(), 'fish_' + pick);
  stat('species', pick);
}

function drawEnding() {

  drawVignette(vctx, vw, vh, idx, G.time);
  ctx.globalAlpha = clamp(Math.min(local, 9 - local + (idx === 3 ? 99 : 0)) / 1.2, 0, 1);
  ctx.drawImage(vc, vx, vy); R(ctx, vx - 2, vy - 2, vw + 4, 2, '#e9dcbc'); R(ctx, vx - 2, vy + vh, vw + 4, 2, '#e9dcbc'); R(ctx, vx - 2, vy, 2, vh, '#e9dcbc'); R(ctx, vx + vw, vy, 2, vh, '#e9dcbc');
  ctx.globalAlpha = 1;

function drawVignette(c, w, h, idx, t) {
  c.imageSmoothingEnabled = false;
  if (idx === 3) { drawSide(c, w, h, t, { night: true, islandX: w * .45, s: .7 }); return; }
  if (idx === 0) { // fisherman on shore
    drawSide(c, w, h, t, { dusk: .3, islandX: -200, s: .5 });
    R(c, 0, h * .7, w * .45, h * .3, '#3a4a3a'); R(c, 0, h * .7, w * .45, 2, '#5a7a4a');
    drawPerson(c, w * .3, h * .72, LOOKS.matvey, { dir: 2, act: true, t });
    c.strokeStyle = '#2a1a10'; c.beginPath(); c.moveTo(w * .32, h * .62); c.lineTo(w * .55, h * .42); c.stroke(); c.strokeStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.moveTo(w * .55, h * .42); c.lineTo(w * .62, h * .74 + Math.sin(t * 3)); c.stroke(); R(c, w * .62 - 1, h * .74 + Math.sin(t * 3) - 1, 3, 2, '#c8303b');
  }
  if (idx === 1) { // Sonya painting the lighthouse
    drawSide(c, w, h, t, { night: true, islandX: w * .66, s: .55 });
    R(c, 0, h * .78, w, h * .22, '#1a2236'); drawPerson(c, w * .2, h * .86, LOOKS.sonya, { dir: 2, act: true, t });
    R(c, w * .27, h * .58, 1, h * .28, '#8a5a32'); R(c, w * .35, h * .58, 1, h * .28, '#8a5a32'); R(c, w * .25, h * .56, 14, 12, '#f4efe4'); R(c, w * .25 + 2, h * .56 + 2, 10, 8, '#1d3a5c'); R(c, w * .25 + 6, h * .56 + 3, 2, 6, '#f1ece2'); R(c, w * .25 + 6, h * .56 + 2, 2, 1, '#ffd477');
  }
  if (idx === 2) { // home: door, family hug
    const sky = c.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, '#2a3a6a'); sky.addColorStop(1, '#f29a5c'); c.fillStyle = sky; c.fillRect(0, 0, w, h);
    R(c, 0, h * .8, w, h * .2, '#4a5a3a'); R(c, w * .45, h * .25, w * .45, h * .55, '#c9a98a'); for (let i = 0; i < 8; i++) R(c, w * .43 + i * w * .06, h * .22 - i * 0, w * .07, 4, '#7a3a2a'); R(c, w * .4, h * .2, w * .55, 6, '#7a3a2a');
    R(c, w * .55, h * .45, w * .1, h * .35, '#ffd477'); R(c, w * .74, h * .4, w * .1, h * .14, '#ffd477'); R(c, w * .79, h * .4, 1, h * .14, '#5a3a2a');

    drawPerson(c, w * .6, h * .86, LOOKS.wife, { dir: 1, act: k >= 1, t });
    drawPerson(c, lerp(w * .66, w * .53, smooth(clamp(k * 1.2 - .1, 0, 1))), h * .87, LOOKS.kid, { dir: 1, moving: k < 1, frame: Math.floor(t * 10) % 4, act: k >= 1, t });
    if (S.flags.cat === 'kept') { const kc = clamp(k * 1.15 - .15, 0, 1); drawCat(c, lerp(w * .04, w * .4, smooth(kc)), h * .87, kc < 1 ? 'walk' : 'sit', 2, t); }
    if (k >= 1) for (let i = 0; i < 3; i++) { const yy = h * .55 - ((t * 10 + i * 8) % 20); R(c, w * .52 + i * 6, yy, 2, 2, '#f07a7a'); R(c, w * .52 + i * 6 + 2, yy, 2, 2, '#f07a7a'); R(c, w * .52 + i * 6 + 1, yy + 2, 2, 1, '#f07a7a'); }
  }
}

  add('div', 'Привезено домой', 'h'); add('div', S.souv.length ? S.souv.map(id => ITEMS[id].n).join(' · ') : 'только воспоминания, и этого достаточно');

// ---------- save ----------
function save() { try { localStorage.setItem('lighthouse-save-v1', JSON.stringify({ day: S.day, inv: S.inv, souv: S.souv, journal: S.journal, read: S.read, flags: S.flags, done: S.done, total: S.total - S.tasks.length, q: S.q, stats: S.stats, atlas: S.atlas })); } catch (e) { } }
function loadSave() { try { const s = JSON.parse(localStorage.getItem('lighthouse-save-v1') || 'null'); return s && s.day >= 1 && s.day <= 7 ? s : null; } catch (e) { return null; } }

// ---------- boot ----------

  Object.assign(S, { day: 1, min: 360, inv: { rod: 1, rag: 1, lantern: 1, keys: 1 }, souv: [], journal: [], read: [], flags: {}, done: 0, total: 0, tasks: [], q: {}, lampLit: false, power: true, stats: {}, atlas: {} });
  if (saved) Object.assign(S, { day: saved.day, inv: saved.inv, souv: saved.souv, journal: saved.journal, read: saved.read || [], flags: saved.flags || {}, done: saved.done, total: saved.total, q: saved.q || {}, stats: saved.stats || {}, atlas: saved.atlas || {} });
